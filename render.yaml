services:
  - type: web
    name: stock-control-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_SECURITY_ENABLED
        value: "true"
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_INVITE_REDIRECT_URL
        sync: false
      - key: SUPABASE_BRANDING_BUCKET
        value: business-branding
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
